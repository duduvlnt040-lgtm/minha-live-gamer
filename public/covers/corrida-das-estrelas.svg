<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080816" />
      <stop offset="50%" stop-color="#141438" />
      <stop offset="100%" stop-color="#05050f" />
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Speed tracks -->
  <path d="M 50 350 L 750 350" stroke="#3b82f6" stroke-width="4" stroke-dasharray="25,20" opacity="0.6" />
  <path d="M 50 250 L 750 250" stroke="#8b5cf6" stroke-width="4" stroke-dasharray="25,20" opacity="0.6" />
  <path d="M 50 450 L 750 450" stroke="#ec4899" stroke-width="4" stroke-dasharray="25,20" opacity="0.6" />

  <!-- Racing car futuristic silhouette -->
  <g transform="translate(420, 290)">
    <!-- Exhaust flame -->
    <path d="M -160 10 L -230 0 L -180 20 L -250 15 L -160 30 Z" fill="url(#fireGrad)" filter="url(#glow)" />
    <!-- Car body -->
    <path d="M -150 20 Q -80 -25 50 -20 Q 120 0 160 25 L 140 38 L -140 38 Z" fill="#0f172a" stroke="url(#neonBlue)" stroke-width="4" filter="url(#glow)" />
    <!-- Cockpit -->
    <path d="M -60 -15 Q 0 -35 50 -15 Z" fill="#38bdf8" opacity="0.8" />
    <!-- Wheels -->
    <circle cx="-90" cy="38" r="24" fill="#020617" stroke="#06b6d4" stroke-width="5" />
    <circle cx="100" cy="38" r="24" fill="#020617" stroke="#06b6d4" stroke-width="5" />
  </g>

  <!-- Tag -->
  <rect x="330" y="390" width="140" height="32" rx="16" fill="#f97316" filter="url(#glow)" />
  <text x="400" y="411" font-family="Arial, sans-serif" font-weight="900" font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="2">MULTIPLAYER</text>

  <!-- Title -->
  <text x="400" y="475" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="1">CORRIDA DAS ESTRELAS</text>
  <text x="400" y="515" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="16" fill="#38bdf8" text-anchor="middle" letter-spacing="4">BATALHA DE CHAT &amp; PRESENTES</text>
</svg>
