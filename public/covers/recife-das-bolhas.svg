<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="oceanBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#021d38" />
      <stop offset="50%" stop-color="#08334c" />
      <stop offset="100%" stop-color="#021422" />
    </linearGradient>
    <linearGradient id="aquaGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#oceanBg)" />

  <!-- Bubbles -->
  <circle cx="200" cy="200" r="30" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.6" filter="url(#glow)" />
  <circle cx="210" cy="190" r="8" fill="#ffffff" opacity="0.7" />
  <circle cx="620" cy="280" r="45" fill="none" stroke="#22d3ee" stroke-width="4" opacity="0.6" filter="url(#glow)" />
  <circle cx="635" cy="265" r="12" fill="#ffffff" opacity="0.7" />
  <circle cx="380" cy="120" r="18" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5" />
  <circle cx="500" cy="350" r="22" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5" />

  <!-- Coral Reef & Treasure Chest -->
  <g transform="translate(400, 270)">
    <!-- Bioluminescent Jellyfish -->
    <path d="M -60 -40 Q 0 -110 60 -40 Q 0 -10 -60 -40 Z" fill="url(#aquaGlow)" opacity="0.8" filter="url(#glow)" />
    <path d="M -40 -35 Q -30 40 -45 90" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M -15 -35 Q 0 50 -10 100" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 15 -35 Q 0 50 10 100" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 40 -35 Q 30 40 45 90" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round" />
  </g>

  <!-- Tag -->
  <rect x="330" y="390" width="140" height="32" rx="16" fill="#0284c7" filter="url(#glow)" />
  <text x="400" y="411" font-family="Arial, sans-serif" font-weight="900" font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="2">AQUÁRIO LIVE</text>

  <!-- Title -->
  <text x="400" y="475" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="1">RECIFE DAS BOLHAS</text>
  <text x="400" y="515" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="16" fill="#38bdf8" text-anchor="middle" letter-spacing="4">INTERATIVO SUBAQUÁTICO</text>
</svg>
